[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "acn-archaeologist-rewrite"
version = "1.0.0"
description = "Azure China pricing and support article extraction pipeline rewrite"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["beautifulsoup4>=4.12,<5"]

[project.optional-dependencies]
dev = ["pytest>=8.4"]

[project.scripts]
acn-archaeologist = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
pythonpath = ["."]
testpaths = ["tests"]
